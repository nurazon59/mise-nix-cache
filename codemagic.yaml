workflows:
  measure-mise-build:
    name: Measure mise Nix build
    instance_type: mac_mini_m2
    max_build_duration: 120
    scripts:
      - name: Install Nix
        script: |
          curl --proto '=https' --tlsv1.2 -sSfL https://install.determinate.systems/nix/tag/v3.24.1 | sh -s -- install macos --no-confirm --prefer-upstream-nix
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version
      - name: Measure upstream build
        script: |
          set -euo pipefail
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          export GITHUB_OUTPUT="$CM_EXPORT_DIR/github-output"
          mkdir -p "$CM_EXPORT_DIR/mise-build-measurement"
          touch "$GITHUB_OUTPUT"
          upstream_sha=$(git ls-remote --exit-code https://github.com/jdx/mise.git refs/heads/main | awk '{print $1}')
          scripts/measure-build.sh "$upstream_sha" "$CM_EXPORT_DIR/mise-build-measurement"
    artifacts:
      - $CM_EXPORT_DIR/mise-build-measurement/**/*

  build-mise-cache:
    name: Build mise Nix cache
    instance_type: mac_mini_m2
    max_build_duration: 120
    scripts:
      - name: Check requested revision
        script: |
          set -euo pipefail
          [[ "$CM_TRIGGER_SOURCE" == api && "$CM_COMMIT" == "$EXPECTED_PROJECT_COMMIT" ]]
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Install Nix
        script: |
          curl --proto '=https' --tlsv1.2 -sSfL https://install.determinate.systems/nix/tag/v3.24.1 | sh -s -- install macos --no-confirm --prefer-upstream-nix
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version
      - name: Build and export unsigned cache
        script: |
          set -euo pipefail
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          export GITHUB_OUTPUT="$CM_BUILD_DIR/codemagic-build-output"
          touch "$GITHUB_OUTPUT"
          bash scripts/build-cache.sh "$UPSTREAM_SHA" "$CM_BUILD_DIR/mise-cache"
          COPYFILE_DISABLE=1 tar -C "$CM_BUILD_DIR/mise-cache" -cf "$CM_BUILD_DIR/mise-cache.tar" manifest.json cache
    artifacts:
      - mise-cache.tar
