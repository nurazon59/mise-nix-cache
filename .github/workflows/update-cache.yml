name: Update Nix cache

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the latest stable release even when already cached
        type: boolean
        required: false
        default: false
      publish:
        description: Publish this manual run after approving the protected environment
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: mise-cache-aarch64-darwin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name != 'schedule' || vars.CACHE_PUBLISH_ENABLED == 'true'
    runs-on: macos-15
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      store_path: ${{ steps.evaluate.outputs.store_path }}
      skip: ${{ steps.cache.outputs.skip }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          github-token: ${{ github.token }}
          determinate: false
          source-tag: v3.24.1
      - name: Resolve latest stable release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-release.sh
      - name: Evaluate store path
        id: evaluate
        env:
          UPSTREAM_SHA: ${{ steps.resolve.outputs.sha }}
        run: echo "store_path=$(nix eval --raw "github:jdx/mise/$UPSTREAM_SHA#mise.outPath")" >> "$GITHUB_OUTPUT"
      - name: Check existing signed cache
        id: cache
        env:
          CACHE_URL: ${{ vars.CACHE_URL }}
          CACHE_PUBLIC_KEY: ${{ vars.CACHE_PUBLIC_KEY }}
          STORE_PATH: ${{ steps.evaluate.outputs.store_path }}
          UPSTREAM_SHA: ${{ steps.resolve.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          metadata_file="$RUNNER_TEMP/existing-cache-metadata.json"
          if [[ "$FORCE" != true && -n "$CACHE_URL" && -n "$CACHE_PUBLIC_KEY" ]] && \
            curl --fail --silent --show-error "$CACHE_URL/_meta/aarch64-darwin/$UPSTREAM_SHA.json" -o "$metadata_file" && \
            jq -e --arg sha "$UPSTREAM_SHA" --arg path "$STORE_PATH" \
              '.schema_version == 1 and .upstream_repository == "jdx/mise" and .upstream_sha == $sha and .system == "aarch64-darwin" and .store_path == $path and .status == "success"' \
              "$metadata_file" >/dev/null && \
            nix store verify --store "$CACHE_URL" --recursive --sigs-needed 1 \
              --option trusted-public-keys "$CACHE_PUBLIC_KEY" "$STORE_PATH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      store_path: ${{ steps.build.outputs.store_path }}
      closure_bytes: ${{ steps.build.outputs.closure_bytes }}
      export_bytes: ${{ steps.build.outputs.export_bytes }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          github-token: ""
          determinate: false
          source-tag: v3.24.1
      - name: Build and export
        id: build
        timeout-minutes: 225
        run: scripts/build-cache.sh "${{ needs.resolve.outputs.sha }}" "$RUNNER_TEMP/mise-cache"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mise-cache-${{ needs.resolve.outputs.sha }}-aarch64-darwin
          path: ${{ runner.temp }}/mise-cache/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.skip != 'true' && github.ref == 'refs/heads/main' && (vars.CACHE_PUBLISH_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: macos-15
    environment: cache-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          github-token: ""
          determinate: false
          source-tag: v3.24.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mise-cache-${{ needs.resolve.outputs.sha }}-aarch64-darwin
          path: ${{ runner.temp }}/mise-cache
      - name: Validate cache artifact
        env:
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
          STORE_PATH: ${{ needs.resolve.outputs.store_path }}
        run: bash scripts/validate-cache-artifact.sh "$RUNNER_TEMP/mise-cache" "$UPSTREAM_SHA" "$STORE_PATH"
      - name: Sign and publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: mise-nix-cache
          NIX_CACHE_SECRET_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
          STORE_PATH: ${{ needs.build.outputs.store_path }}
          EXPECTED_STORE_PATH: ${{ needs.resolve.outputs.store_path }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          [[ "$STORE_PATH" == "$EXPECTED_STORE_PATH" && -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" && -n "$NIX_CACHE_SECRET_KEY" ]]
          [[ "$R2_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          key_file="$RUNNER_TEMP/cache-secret.key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s' "$NIX_CACHE_SECRET_KEY" > "$key_file"
          nix copy --no-check-sigs --from "file://$RUNNER_TEMP/mise-cache/cache" \
            --to "s3://$R2_BUCKET?endpoint=$R2_ACCOUNT_ID.r2.cloudflarestorage.com&region=auto&secret-key=$key_file" \
            "$STORE_PATH"

  verify:
    needs: [resolve, build, publish]
    if: needs.resolve.outputs.skip != 'true'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          github-token: ""
          determinate: false
          source-tag: v3.24.1
      - name: Restore from public cache
        env:
          CACHE_URL: ${{ vars.CACHE_URL }}
          CACHE_PUBLIC_KEY: ${{ vars.CACHE_PUBLIC_KEY }}
          STORE_PATH: ${{ needs.build.outputs.store_path }}
        run: |
          set -euo pipefail
          [[ -n "$CACHE_URL" && -n "$CACHE_PUBLIC_KEY" ]]
          if nix path-info "$STORE_PATH" >/dev/null 2>&1; then
            echo "Store path already exists on the verification runner" >&2
            exit 1
          fi
          nix store verify --store "$CACHE_URL" --recursive --sigs-needed 1 \
            --option trusted-public-keys "$CACHE_PUBLIC_KEY" "$STORE_PATH"
          nix copy --from "$CACHE_URL" --option trusted-public-keys "$CACHE_PUBLIC_KEY" "$STORE_PATH"
          "$STORE_PATH/bin/mise" --version

  record-success:
    needs: [resolve, build, publish, verify]
    if: needs.resolve.outputs.skip != 'true' && needs.verify.result == 'success'
    runs-on: macos-15
    environment: cache-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Record successful publication
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: mise-nix-cache
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
          STORE_PATH: ${{ needs.build.outputs.store_path }}
          EXPORT_BYTES: ${{ needs.build.outputs.export_bytes }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/write-success-metadata.sh "$UPSTREAM_SHA" "$STORE_PATH" "$EXPORT_BYTES" "$WORKFLOW_RUN_URL"
